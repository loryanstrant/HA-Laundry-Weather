name: Validate

on:
  # main only. A push to a PR branch would otherwise start this workflow
  # twice over for the same commit - once here and once via pull_request.
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Supersede rather than queue: when a branch gets a newer commit, the older
# run for that branch is cancelled instead of waiting its turn on the single
# shared Actions runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: HACS Validation
    # GitHub only. hacs/action talks to api.github.com unconditionally and takes no base-URL
    # input, so on Gitea it fails "Bad credentials" with the Gitea token it is handed and can
    # never pass. Upstream will not support another forge: hacs/integration#3246 was closed
    # not_planned with "only the public facing GitHub will be supported". The GitHub mirror
    # runs this same workflow and validates for real.
    # NB: test for github.com positively — our Gitea's server_url is
    # http://soundwave.strant.casa:3222, which contains no "gitea" to match on.
    if: ${{ github.server_url == 'https://github.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest
