<?xml version="1.0" encoding="UTF-8"?>
<!--
  Laundry Weather mascot — approving.

  Hand-authored so it scales cleanly at any card width and carries no bitmap.
  The speech bubble is drawn by the card, not baked in here, so one asset
  serves the good/bad and English/Klingon combinations.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" role="img"
     aria-label="A Klingon officer nodding in approval">
  <defs>
    <linearGradient id="lw-skin-good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9663f"/>
      <stop offset="1" stop-color="#7d4527"/>
    </linearGradient>
  </defs>

  <!-- shoulders and uniform -->
  <path d="M12 150 q0-30 22-38 l26-8 26 8 q22 8 22 38 z" fill="#1b1b1f"/>
  <!-- red shoulder band -->
  <path d="M12 150 q0-9 2-16 l92 0 q2 7 2 16 z" fill="#8c1d24"/>
  <!-- baldric sash -->
  <path d="M40 108 l16-6 30 48 -18 0 z" fill="#9a9aa2"/>
  <path d="M40 108 l16-6 30 48 -18 0 z" fill="none" stroke="#6d6d75" stroke-width="1.5"/>
  <!-- comm badge -->
  <path d="M30 128 l9-5 9 5 -9 6 z" fill="#c9a227"/>

  <!-- neck -->
  <path d="M46 92 h28 v18 q-14 8 -28 0 z" fill="#6f3d23"/>

  <!-- hair, behind the head -->
  <path d="M22 60 q-2-40 38-42 q40 2 38 42 q2 22 -6 30 q2-34 -32-36 q-34 2 -32 36 q-8-8 -6-30z"
        fill="#161616"/>

  <!-- head -->
  <path d="M26 58 q0-34 34-34 q34 0 34 34 q0 30 -12 42 q-9 9 -22 9 q-13 0 -22-9 q-12-12 -12-42z"
        fill="url(#lw-skin-good)"/>

  <!-- forehead ridges: the whole point of the character -->
  <g fill="none" stroke="#5f3018" stroke-width="2.4" stroke-linecap="round">
    <path d="M38 40 q22-11 44 0"/>
    <path d="M40 47 q20-10 40 0"/>
    <path d="M60 30 v22"/>
    <path d="M50 33 q3 10 2 19"/>
    <path d="M70 33 q-3 10 -2 19"/>
  </g>
  <path d="M34 44 q26-14 52 0 q-3 8 -8 9 q-18-9 -36 0 q-5-1 -8-9z"
        fill="#8a5230" opacity="0.85"/>

  <!-- brow -->
  <path d="M40 60 q10-4 16 0" stroke="#3d1f0f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M64 60 q6-4 16 0" stroke="#3d1f0f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- eyes, narrowed with approval rather than fury -->
  <path d="M43 68 q7-5 13 0 q-6 4 -13 0z" fill="#ffffff"/>
  <path d="M64 68 q6-5 13 0 q-6 4 -13 0z" fill="#ffffff"/>
  <circle cx="49" cy="68" r="2.6" fill="#20120a"/>
  <circle cx="70" cy="68" r="2.6" fill="#20120a"/>

  <!-- nose -->
  <path d="M60 70 q-4 10 -1 13 q3 2 6 0" fill="none" stroke="#5f3018" stroke-width="2"
        stroke-linecap="round"/>

  <!-- moustache and beard -->
  <path d="M44 88 q16-7 32 0 q-4 18 -16 20 q-12-2 -16-20z" fill="#161616"/>
  <path d="M46 86 q14-8 28 0 q-14 5 -28 0z" fill="#161616"/>

  <!-- a grim approving half-smile, visible between moustache and beard -->
  <path d="M52 90 q8 5 16 0" fill="none" stroke="#3a1c0d" stroke-width="2"
        stroke-linecap="round"/>
</svg>
